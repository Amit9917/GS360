<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS360 Command Center</title>
  <link rel="stylesheet" href="design-system.css">
  <style>
    body { margin: 0; background: #05070A; font-family: Inter, sans-serif; color: #F8F9FA; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 32px; }
    .muted { color: #94A3B8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Daily Command Center</h1>
    <p class="muted">Execution-first dashboard scaffold for Week 7.</p>
    <div class="gs-kpi-grid">
      <div class="gs-card"><strong>Study</strong><p class="muted">2 blocks due</p></div>
      <div class="gs-card"><strong>Revise</strong><p class="muted">14 flashcards</p></div>
      <div class="gs-card"><strong>Write</strong><p class="muted">1 mains answer</p></div>
      <div class="gs-card"><strong>Fix</strong><p class="muted">Economy weak area</p></div>
    </div>
  </div>
</body>
</html>
